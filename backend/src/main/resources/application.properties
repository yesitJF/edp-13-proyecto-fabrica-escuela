spring.application.name=banco-digital-backend

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
app.security.token-secret=${TOKEN_SECRET}
app.security.token-expiration-minutes=${TOKEN_EXPIRATION_MINUTES:60}
app.security.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
app.security.lock-minutes=${LOGIN_LOCK_MINUTES:15}
app.security.bootstrap-manager-username=${BOOTSTRAP_MANAGER_USERNAME:}
app.security.bootstrap-manager-password=${BOOTSTRAP_MANAGER_PASSWORD:}

app.cards.credit-requires-active-client=${CARD_CREDIT_REQUIRES_ACTIVE_CLIENT:true}
app.cards.credit-minimum-age=${CARD_CREDIT_MINIMUM_AGE:18}
app.cards.credit-minimum-active-accounts=${CARD_CREDIT_MINIMUM_ACTIVE_ACCOUNTS:1}
app.cards.credit-default-limit=${CARD_CREDIT_DEFAULT_LIMIT:1000000.00}